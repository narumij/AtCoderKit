name: Tessoku input formats

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  input-tests:
    name: Tessoku input (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
      - name: Test all published input formats
        shell: bash
        run: |
          mkdir -p .build/tessoku-logs
          swift --version | tee .build/tessoku-logs/environment.log
          set -o pipefail
          swift test --build-system native -c "${{ matrix.configuration }}" \
            --filter TessokuInputTests 2>&1 | tee .build/tessoku-logs/tests.log
          grep -Eq 'Executed 269 tests, with 0 failures' .build/tessoku-logs/tests.log
      - name: Upload input-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessoku-input-${{ matrix.configuration }}-diagnostics
          path: .build/tessoku-logs
          if-no-files-found: warn
